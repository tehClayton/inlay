<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="inlay">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1B2430">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>inlay</title>
<style>
  :root{
    /* millitap's tokens, unchanged, so the two apps read as one publisher's.
       Two surface roles, and the difference carries meaning: recessed wells
       hold what you read, raised faces are what you touch. */
    --ground:#0E1419;
    --panel:#1A232C;        /* recessed */
    --panel-hi:#26323E;     /* raised, pressed */
    --raise-a:#2A3743;      /* raised face, gradient top */
    --raise-b:#1E2933;      /* raised face, gradient bottom */
    --rule:#2B3743;
    --ink:#EAF0F6;
    --ink-dim:#93A4B7;
    --ink-mute:#66788C;

    /* Right and wrong keep millitap's on-the-beat green and missed rose, which
       already mean exactly that across the family. */
    --true:#7FCB8F;
    --miss:#C2566B;

    --sp1:4px; --sp2:8px; --sp3:12px; --sp4:16px; --sp5:24px;
    --r1:6px; --r2:10px; --r3:14px;

    --fig: ui-monospace, "SF Mono", Menlo, monospace;
    --ui: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  /* Author display rules beat the UA sheet's [hidden], so any element that
     takes a display rule would silently stop hiding. Global, so none can. */
  [hidden]{display:none!important}
  html,body{height:100%;overflow:hidden;overscroll-behavior:none}
  body{
    background-color:var(--ground);
    /* A single soft light from above, as in millitap. */
    background-image:radial-gradient(120% 76% at 50% -14%, #18232E 0%, rgba(24,35,46,0) 64%);
    color:var(--ink); font-family:var(--ui);
    -webkit-user-select:none; user-select:none; -webkit-tap-highlight-color:transparent;
    touch-action:manipulation;
    display:flex; flex-direction:column;
    padding:max(var(--sp2),env(safe-area-inset-top)) max(var(--sp2),env(safe-area-inset-right))
            max(var(--sp2),env(safe-area-inset-bottom)) max(var(--sp2),env(safe-area-inset-left));
    gap:var(--sp2);
  }

  .topbar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;
    flex:0 0 auto;padding:0 var(--sp1)}
  .brand{display:flex;align-items:center;gap:var(--sp2)}
  .topbar h1{font-size:13px;font-weight:600;color:var(--ink);letter-spacing:.05em}
  /* The icon at header scale: a nut, frets, strings, the pearl inlay between
     two strings and one found note sitting on a string. */
  .mark{width:19px;height:19px;flex:0 0 auto}
  .mark .nut{fill:var(--ink-dim)}
  .mark .fret{fill:#485A6E}
  .mark .str{fill:#78889A}
  .mark .pearl{fill:#E2DCCD}
  .mark .found{fill:var(--true)}
  .navs{justify-self:end;display:flex;align-items:center;gap:2px}
  .navbtn{display:flex;align-items:center;justify-content:center;padding:var(--sp1);
    background:none;border:none;box-shadow:none;color:var(--ink-mute)}
  .navbtn svg{width:17px;height:17px;fill:currentColor;display:block}
  .navbtn:active{background:none}
  .navbtn.on{color:var(--ink)}

  button{font-family:inherit;color:var(--ink);
    background:linear-gradient(var(--raise-a),var(--raise-b));
    border:1px solid var(--rule);border-radius:var(--r1);
    padding:10px 14px;font-size:13px;cursor:pointer;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.055)}
  button:active{background:var(--panel-hi);box-shadow:none}
  button:focus-visible{outline:2px solid var(--true);outline-offset:2px}

  /* The practice surface. The prompt reads at a glance above the well the
     fretboard will sit in. */
  .stage{flex:1 1 auto;display:flex;flex-direction:column;gap:var(--sp2);min-height:0}
  .prompt{flex:0 0 auto;min-height:44px;display:flex;align-items:center;
    justify-content:center;font-size:19px;color:var(--ink-dim);text-align:center}
  .board{flex:1 1 auto;min-height:140px;position:relative;background:var(--panel);
    border-radius:var(--r2);overflow:hidden;display:flex;align-items:center;
    justify-content:center;
    box-shadow:inset 0 0 0 1px rgba(0,0,0,.42), inset 0 2px 5px rgba(0,0,0,.34)}
  .empty{font-size:12px;line-height:1.6;color:var(--ink-mute);max-width:44ch;
    text-align:center;padding:var(--sp4)}

  .settings{position:fixed;z-index:20;left:50%;transform:translateX(-50%);
    top:calc(max(var(--sp2),env(safe-area-inset-top)) + 36px);
    width:calc(100% - var(--sp4));max-width:640px;
    max-height:calc(100% - 64px - env(safe-area-inset-top) - env(safe-area-inset-bottom));
    background:#1F2A35;border:1px solid var(--rule);border-radius:var(--r3);
    box-shadow:0 26px 64px rgba(0,0,0,.66), inset 0 1px 0 rgba(255,255,255,.055);
    overflow-y:auto;-webkit-overflow-scrolling:touch}
  .settings:focus{outline:none}
  #scrim{position:fixed;inset:0;z-index:19;background:rgba(5,9,13,.62);
    -webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px)}

  .sect{display:grid;gap:var(--sp2);padding:var(--sp3) var(--sp4)}
  .sect + .sect{border-top:1px solid var(--rule)}
  .sect h2{font-size:10px;font-weight:600;letter-spacing:.11em;
    text-transform:uppercase;color:var(--ink-mute)}
  .note{font-size:12px;line-height:1.6;color:var(--ink-dim);max-width:62ch}

  /* Deliberately the quietest thing in the panel: muted ink, small, and the
     links carry no button chrome. The register is a footer, not an ask. */
  .about p{font-family:var(--fig);font-size:11px;color:var(--ink-mute);line-height:1.7}
  .about b{font-weight:500;color:var(--ink-dim)}
  .about .sep{opacity:.5;padding:0 2px}
  .about a{color:var(--ink-dim);text-decoration:underline;
    text-underline-offset:2px;text-decoration-color:var(--rule)}
  .about a:hover{color:var(--ink);text-decoration-color:var(--ink-mute)}
  .about a:focus-visible{outline:2px solid var(--true);outline-offset:2px}

  #toast{position:fixed;left:50%;transform:translateX(-50%);
    bottom:calc(var(--sp4) + env(safe-area-inset-bottom));
    background:var(--true);color:#0C1710;padding:11px 17px;border-radius:var(--r1);
    font-size:13px;font-weight:600;z-index:30;border:none;
    box-shadow:0 10px 28px rgba(0,0,0,.5)}

  #msg{position:fixed;left:50%;transform:translateX(-50%) translateY(6px);
    bottom:calc(var(--sp4) + env(safe-area-inset-bottom));
    background:var(--panel-hi);color:var(--ink);border:1px solid var(--rule);
    padding:9px 15px;border-radius:var(--r1);font-size:12px;z-index:29;
    box-shadow:0 10px 28px rgba(0,0,0,.5);pointer-events:none;
    opacity:0;visibility:hidden;
    transition:opacity .14s linear, transform .14s ease-out}
  #msg.on{opacity:1;visibility:visible;transform:translateX(-50%) translateY(0)}
  @media (prefers-reduced-motion:reduce){ #msg{transition:none} }
</style>
</head>
<body>

<header class="topbar">
  <span></span>
  <span class="brand">
    <svg class="mark" viewBox="0 0 24 24" aria-hidden="true">
      <rect class="nut"  x="3.4"  y="5.6" width="1.2" height="12.8"/>
      <rect class="fret" x="9.4"  y="5.6" width="0.7" height="12.8"/>
      <rect class="fret" x="14.7" y="5.6" width="0.7" height="12.8"/>
      <rect class="fret" x="20"   y="5.6" width="0.7" height="12.8"/>
      <rect class="str"  x="4"    y="7.7"  width="16.7" height="0.5"/>
      <rect class="str"  x="4"    y="10.3" width="16.7" height="0.6"/>
      <rect class="str"  x="4"    y="13"   width="16.7" height="0.7"/>
      <rect class="str"  x="4"    y="15.6" width="16.7" height="0.8"/>
      <circle class="pearl" cx="12.2" cy="12" r="1.2"/>
      <circle class="found" cx="6.9" cy="16" r="1.8"/>
    </svg>
    <h1>inlay</h1>
  </span>
  <span class="navs">
    <button id="gear" class="navbtn" aria-expanded="false" aria-controls="settings">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19.14 12.94a7.07 7.07 0 0 0 .06-.94 7.07 7.07 0 0 0-.06-.94l2.03-1.58a.5.5 0 0 0 .12-.61l-1.92-3.32a.5.5 0 0 0-.6-.22l-2.39.96a7.03 7.03 0 0 0-1.62-.94l-.36-2.54a.5.5 0 0 0-.5-.42h-3.84a.5.5 0 0 0-.5.42l-.36 2.54c-.59.24-1.13.56-1.62.94l-2.39-.96a.5.5 0 0 0-.6.22L2.74 8.87a.5.5 0 0 0 .12.61l2.03 1.58c-.04.31-.06.62-.06.94s.02.63.06.94l-2.03 1.58a.5.5 0 0 0-.12.61l1.92 3.32c.12.22.38.3.6.22l2.39-.96c.49.38 1.03.7 1.62.94l.36 2.54c.04.24.25.42.5.42h3.84c.25 0 .46-.18.5-.42l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.48 0 .6-.22l1.92-3.32a.5.5 0 0 0-.12-.61l-2.03-1.58zM12 15.6A3.6 3.6 0 1 1 12 8.4a3.6 3.6 0 0 1 0 7.2z"/></svg>
    </button>
  </span>
</header>

<main class="stage">
  <div class="prompt" id="prompt" aria-live="polite"></div>
  <div class="board" id="board">
    <p class="empty" id="empty">Nothing to practise yet. This build is the app
      shell; the fretboard and drills arrive in the next ones.</p>
  </div>
</main>

<div id="scrim" hidden></div>
<div class="settings" id="settings" role="dialog" aria-modal="true"
     aria-labelledby="setTitle" tabindex="-1" hidden>
  <div class="sect">
    <h2 id="setTitle">Settings</h2>
    <p class="note">Instrument and practice settings will live here.</p>
  </div>

  <!-- Metadata, not a donation bar, and in millitap's order: lowest commitment
       first, so a one-off tip reads before a recurring one. What each link is
       for is said on hover, not in the line. -->
  <div class="sect about">
    <p>
      inlay <b id="aboutVer">—</b>
      <span class="sep">·</span>
      <a href="https://github.com/tehClayton/inlay" id="aboutSrc"
         target="_blank" rel="noopener noreferrer">source</a>
      <span class="sep">·</span>
      <a href="https://buymeacoffee.com/ditherstudio" id="aboutBmc"
         target="_blank" rel="noopener noreferrer">buy me a coffee</a>
      <span class="sep">·</span>
      <a href="https://www.patreon.com/DitherStudio" id="aboutPat"
         target="_blank" rel="noopener noreferrer">patreon</a>
    </p>
  </div>
</div>

<div id="msg" role="status" aria-live="polite"></div>
<button id="toast" type="button" hidden>Updated — tap to reload</button>

<script type="module">
import { $, label, showVersion, watchForUpdates } from "./ui.js";

/* ------------------------------------------------------------- settings */
/* Focus moves into the panel on open and back to the gear on close, so a
   keyboard user is never left on a control hidden behind the scrim. */
function setSettings(open){
  const s = $("settings");
  s.hidden = !open;
  $("scrim").hidden = !open;
  $("gear").classList.toggle("on", open);
  $("gear").setAttribute("aria-expanded", String(open));
  if (open) s.focus(); else $("gear").focus();
}

label($("gear"), "Settings");
$("gear").onclick  = () => setSettings($("settings").hidden);
$("scrim").onclick = () => setSettings(false);
addEventListener("keydown", e => {
  if (e.key === "Escape" && !$("settings").hidden) setSettings(false);
});

/* --------------------------------------------------------------- footer */
label($("aboutSrc"), "inlay on GitHub — the source and how to report a problem");
label($("aboutBmc"), "Buy me a coffee — a one-off tip if this has been useful");
label($("aboutPat"), "Patreon — support ongoing development");
showVersion($("aboutVer"));

/* -------------------------------------------------------------- install */
watchForUpdates();
</script>
</body>
</html>
