<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="inlay">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1B2430">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>inlay</title>
<style>
  :root{
    /* millitap's tokens, unchanged, so the two apps read as one publisher's.
       Two surface roles, and the difference carries meaning: recessed wells
       hold what you read, raised faces are what you touch. */
    --ground:#0E1419;
    --panel:#1A232C;        /* recessed */
    --panel-hi:#26323E;     /* raised, pressed */
    --raise-a:#2A3743;      /* raised face, gradient top */
    --raise-b:#1E2933;      /* raised face, gradient bottom */
    --rule:#2B3743;
    --ink:#EAF0F6;
    --ink-dim:#93A4B7;
    --ink-mute:#66788C;

    /* Right and wrong keep millitap's on-the-beat green and missed rose, which
       already mean exactly that across the family. */
    --true:#7FCB8F;
    --miss:#C2566B;

    /* The neck. Dark, low-saturation wood that sits on the ground rather
       than competing with it; the colour belongs to what you tap, not to the
       instrument. Pale pearl inlays, and metal that reads as metal without
       outshining the marks drawn over it. */
    --wood-a:#2B2420;
    --wood-b:#231D1A;
    --fret:#7E8893;
    --nut:#CFC8B8;
    --string:#A9B3BD;
    --pearl:#E2DCCD;
    --edge:#4A3E36;

    --sp1:4px; --sp2:8px; --sp3:12px; --sp4:16px; --sp5:24px;
    --r1:6px; --r2:10px; --r3:14px;

    --fig: ui-monospace, "SF Mono", Menlo, monospace;
    --ui: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  /* Author display rules beat the UA sheet's [hidden], so any element that
     takes a display rule would silently stop hiding. Global, so none can. */
  [hidden]{display:none!important}
  html,body{height:100%;overflow:hidden;overscroll-behavior:none}
  body{
    background-color:var(--ground);
    /* A single soft light from above, as in millitap. */
    background-image:radial-gradient(120% 76% at 50% -14%, #18232E 0%, rgba(24,35,46,0) 64%);
    color:var(--ink); font-family:var(--ui);
    -webkit-user-select:none; user-select:none; -webkit-tap-highlight-color:transparent;
    touch-action:manipulation;
    display:flex; flex-direction:column;
    padding:max(var(--sp2),env(safe-area-inset-top)) max(var(--sp2),env(safe-area-inset-right))
            max(var(--sp2),env(safe-area-inset-bottom)) max(var(--sp2),env(safe-area-inset-left));
    gap:var(--sp2);
  }

  .topbar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;
    flex:0 0 auto;padding:0 var(--sp1)}
  .brand{display:flex;align-items:center;gap:var(--sp2)}
  .topbar h1{font-size:13px;font-weight:600;color:var(--ink);letter-spacing:.05em}
  /* The icon at header scale: a nut, frets, strings, the pearl inlay between
     two strings and one found note sitting on a string. */
  .mark{width:19px;height:19px;flex:0 0 auto}
  .mark .nut{fill:var(--ink-dim)}
  .mark .fret{fill:#485A6E}
  .mark .str{fill:#78889A}
  .mark .pearl{fill:#E2DCCD}
  .mark .found{fill:var(--true)}
  .navs{justify-self:end;display:flex;align-items:center;gap:2px}
  .navbtn{display:flex;align-items:center;justify-content:center;padding:var(--sp1);
    background:none;border:none;box-shadow:none;color:var(--ink-mute)}
  .navbtn svg{width:17px;height:17px;fill:currentColor;display:block}
  .navbtn:active{background:none}
  .navbtn.on{color:var(--ink)}

  button{font-family:inherit;color:var(--ink);
    background:linear-gradient(var(--raise-a),var(--raise-b));
    border:1px solid var(--rule);border-radius:var(--r1);
    padding:10px 14px;font-size:13px;cursor:pointer;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.055)}
  button:active{background:var(--panel-hi);box-shadow:none}
  button:focus-visible{outline:2px solid var(--true);outline-offset:2px}

  /* The practice surface. The prompt reads at a glance above the well the
     fretboard will sit in. */
  .stage{flex:1 1 auto;display:flex;flex-direction:column;gap:var(--sp2);min-height:0}
  .prompt{flex:0 0 auto;min-height:44px;display:flex;align-items:center;
    justify-content:center;font-size:19px;color:var(--ink-dim);text-align:center}
  .board{flex:1 1 auto;min-height:140px;position:relative;background:var(--panel);
    border-radius:var(--r2);overflow:hidden;display:flex;align-items:center;
    justify-content:center;
    box-shadow:inset 0 0 0 1px rgba(0,0,0,.42), inset 0 2px 5px rgba(0,0,0,.34)}
  .empty{font-size:12px;line-height:1.6;color:var(--ink-mute);max-width:44ch;
    text-align:center;padding:var(--sp4)}

  .settings{position:fixed;z-index:20;left:50%;transform:translateX(-50%);
    top:calc(max(var(--sp2),env(safe-area-inset-top)) + 36px);
    width:calc(100% - var(--sp4));max-width:640px;
    max-height:calc(100% - 64px - env(safe-area-inset-top) - env(safe-area-inset-bottom));
    background:#1F2A35;border:1px solid var(--rule);border-radius:var(--r3);
    box-shadow:0 26px 64px rgba(0,0,0,.66), inset 0 1px 0 rgba(255,255,255,.055);
    overflow-y:auto;-webkit-overflow-scrolling:touch}
  .settings:focus{outline:none}
  #scrim{position:fixed;inset:0;z-index:19;background:rgba(5,9,13,.62);
    -webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px)}

  .sect{display:grid;gap:var(--sp2);padding:var(--sp3) var(--sp4)}
  .sect + .sect{border-top:1px solid var(--rule)}
  .sect h2{font-size:10px;font-weight:600;letter-spacing:.11em;
    text-transform:uppercase;color:var(--ink-mute)}
  .note{font-size:12px;line-height:1.6;color:var(--ink-dim);max-width:62ch}

  /* Deliberately the quietest thing in the panel: muted ink, small, and the
     links carry no button chrome. The register is a footer, not an ask. */
  .about p{font-family:var(--fig);font-size:11px;color:var(--ink-mute);line-height:1.7}
  .about b{font-weight:500;color:var(--ink-dim)}
  .about .sep{opacity:.5;padding:0 2px}
  .about a{color:var(--ink-dim);text-decoration:underline;
    text-underline-offset:2px;text-decoration-color:var(--rule)}
  .about a:hover{color:var(--ink);text-decoration-color:var(--ink-mute)}
  .about a:focus-visible{outline:2px solid var(--true);outline-offset:2px}

  #toast{position:fixed;left:50%;transform:translateX(-50%);
    bottom:calc(var(--sp4) + env(safe-area-inset-bottom));
    background:var(--true);color:#0C1710;padding:11px 17px;border-radius:var(--r1);
    font-size:13px;font-weight:600;z-index:30;border:none;
    box-shadow:0 10px 28px rgba(0,0,0,.5)}

  #msg{position:fixed;left:50%;transform:translateX(-50%) translateY(6px);
    bottom:calc(var(--sp4) + env(safe-area-inset-bottom));
    background:var(--panel-hi);color:var(--ink);border:1px solid var(--rule);
    padding:9px 15px;border-radius:var(--r1);font-size:12px;z-index:29;
    box-shadow:0 10px 28px rgba(0,0,0,.5);pointer-events:none;
    opacity:0;visibility:hidden;
    transition:opacity .14s linear, transform .14s ease-out}
  #msg.on{opacity:1;visibility:visible;transform:translateX(-50%) translateY(0)}
  @media (prefers-reduced-motion:reduce){ #msg{transition:none} }

  /* The instrument switcher is the header's left label: what you are
     practising on, and the way to change it, in one place. */
  .instbtn{justify-self:start;display:flex;align-items:center;gap:6px;min-width:0;
    max-width:100%;padding:6px 8px;background:none;border:none;box-shadow:none;
    color:var(--ink-dim);font-size:12px}
  .instbtn:active{background:none}
  .instbtn span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .instbtn svg{width:9px;height:9px;fill:currentColor;opacity:.6;flex:0 0 auto}
  .instbtn.on{color:var(--ink)}

  button:disabled{opacity:.35;cursor:default}
  button.go{background:var(--true);border-color:var(--true);color:#0C1710;font-weight:600}
  .mini{padding:6px 8px;font-size:11px;min-width:28px;line-height:1;color:var(--ink-dim)}
  .mini.warn{color:var(--miss);border-color:rgba(194,86,107,.4)}
  .hint{font-family:var(--fig);font-size:10px;font-weight:400;letter-spacing:0;
    text-transform:none;color:var(--ink-mute);opacity:.8}

  .pick{display:flex;flex-wrap:wrap;gap:var(--sp2)}
  .chip{padding:8px 12px;font-size:12px;line-height:1}
  .chip.sel{background:var(--true);border-color:var(--true);color:#0C1710;
    box-shadow:0 0 18px -7px var(--true)}
  /* A chip that names a choice and says what it means underneath. */
  .chip.two{display:grid;gap:4px;text-align:left;padding:9px 12px}
  .chip.two b{font-weight:600}
  .chip.two i{font-style:normal;font-size:10px;opacity:.75}
  /* Not a button: "custom" is what the sliders made, not a choice to pick. */
  .chip.custom{cursor:default}

  /* The editor's view preview: the draft drawn as the board will draw it. */
  .fbprev{height:132px;background:var(--panel);border-radius:var(--r2);overflow:hidden;
    box-shadow:inset 0 0 0 1px rgba(0,0,0,.42), inset 0 2px 5px rgba(0,0,0,.34)}
  .slide{display:grid;grid-template-columns:minmax(110px,auto) 1fr minmax(150px,auto);
    align-items:center;gap:var(--sp3);font-size:12px;color:var(--ink-dim)}
  .slide input{width:100%;accent-color:var(--true)}
  .slide .val{font-family:var(--fig);font-size:11px;color:var(--ink);text-align:right}
  .slide .axis{font-style:normal;font-family:var(--fig);font-size:10px;color:var(--ink-mute)}
  /* What the sliders add up to, in the words you'd describe the picture by. */
  .effects{font-family:var(--fig);font-size:11px;color:var(--ink);padding:6px 10px;
    border-radius:var(--r1);background:rgba(255,255,255,.03);border-left:3px solid var(--ink-mute)}
  @media (max-width:520px){
    .slide{grid-template-columns:1fr auto}
    .slide input{grid-column:1 / -1;grid-row:2}
  }

  /* Text fields sit recessed, like the wells: they hold something you read
     back. Selectable, unlike the rest of the page. */
  input[type=text]{font-family:inherit;font-size:14px;color:var(--ink);width:100%;
    background:var(--panel);border:1px solid var(--rule);border-radius:var(--r1);
    padding:8px 10px;-webkit-user-select:text;user-select:text;
    box-shadow:inset 0 1px 3px rgba(0,0,0,.3)}
  input:focus-visible{outline:2px solid var(--true);outline-offset:1px}
  input[aria-invalid]{border-color:var(--miss);box-shadow:0 0 0 1px var(--miss)}
  .num{width:64px;font-family:var(--fig);text-align:center}
  .num.sm{width:48px;flex:0 0 auto}
  label.inline{display:flex;align-items:center;gap:var(--sp3);font-size:12px;color:var(--ink-dim)}
  .check{display:flex;align-items:center;gap:var(--sp3);font-size:12px;color:var(--ink-dim)}
  .check input{width:19px;height:19px;accent-color:var(--true);flex:0 0 auto}

  .strows{display:grid;gap:4px}
  .strow{display:flex;align-items:center;gap:var(--sp2)}
  .strow .sn{font-family:var(--fig);font-size:11px;color:var(--ink-mute);
    min-width:2ch;text-align:right;flex:0 0 auto}
  .strow .tune{flex:1;min-width:0;font-family:var(--fig)}
  .nutlab{font-size:9px;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-mute)}

  .actions .btns{display:flex;align-items:center;gap:var(--sp2)}
  .grow{flex:1}
  .err{font-size:12px;line-height:1.5;color:var(--miss)}
  .err:empty{display:none}

  .instrows{display:grid;gap:2px}
  .instrow{display:flex;align-items:center;gap:var(--sp2)}
  .instrow .pickme{flex:1;min-width:0;display:grid;gap:3px;text-align:left;
    background:rgba(255,255,255,.022);border:1px solid transparent;box-shadow:none;
    padding:9px 10px}
  .instrow .pickme b{font-size:13px;font-weight:600;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .instrow .pickme i{font-style:normal;font-family:var(--fig);font-size:10px;
    color:var(--ink-mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .instrow.sel .pickme{background:rgba(127,203,143,.12);border-color:var(--true)}

  /* The fretboard fills the well; the SVG's viewBox is set to the well's
     pixel size, so strokes and text stay crisp at any size. */
  .board.live{display:block;touch-action:none}
  .fb{display:block;width:100%;height:100%}
  .fb-wood{fill:url(#fbWood)}
  .fb-open{fill:rgba(255,255,255,.02)}
  .fb-fret{stroke:var(--fret);stroke-width:2;stroke-linecap:round}
  .fb-nut{stroke:var(--nut);stroke-width:5;stroke-linecap:round}
  .fb-spike{fill:var(--nut)}
  .fb-string{stroke:var(--string);stroke-linecap:round}
  .fb-inlay{fill:var(--pearl);opacity:.85}
  /* The player's view: the fretboard's near edge, lighter as the binding in
     the light, with its side dots. */
  .fb-edge{fill:var(--edge)}
  .fb-side{fill:var(--pearl)}
  .fb-num{fill:var(--ink-mute);font-family:var(--fig);font-size:10px;text-anchor:middle}
  .fb-dim{fill:var(--ground);opacity:.62}
  .fb-mark circle{stroke-width:2}
  .fb-mark text{font-family:var(--ui);font-weight:600;text-anchor:middle;
    dominant-baseline:central}
  .fb-mark.note circle{fill:var(--ink);stroke:var(--ink)}
  .fb-mark.note text{fill:#0C1710}
  .fb-mark.true circle{fill:var(--true);stroke:var(--true)}
  .fb-mark.true text{fill:#0C1710}
  .fb-mark.miss circle{fill:var(--miss);stroke:var(--miss)}
  .fb-mark.miss text{fill:#fff}
  .fb-mark.target circle{fill:none;stroke:var(--ink)}
  .fb-mark.target text{fill:var(--ink)}

  .prompt b{color:var(--ink);font-weight:600}
  .prompt i{font-style:normal;font-size:13px;color:var(--ink-mute);margin-left:var(--sp2)}

  .boardinfo{display:grid;gap:6px;justify-items:center;text-align:center;padding:var(--sp4)}
  .boardinfo b{font-size:15px;font-weight:600}
  .boardinfo i{font-style:normal;font-family:var(--fig);font-size:11px;color:var(--ink-dim)}
</style>
</head>
<body>

<header class="topbar">
  <button id="instBtn" class="instbtn" aria-expanded="false" aria-controls="instPanel">
    <span id="instName">No instrument</span>
    <svg viewBox="0 0 10 10" aria-hidden="true"><path d="M1 3l4 4 4-4z"/></svg>
  </button>
  <span class="brand">
    <svg class="mark" viewBox="0 0 24 24" aria-hidden="true">
      <rect class="nut"  x="3.4"  y="5.6" width="1.2" height="12.8"/>
      <rect class="fret" x="9.4"  y="5.6" width="0.7" height="12.8"/>
      <rect class="fret" x="14.7" y="5.6" width="0.7" height="12.8"/>
      <rect class="fret" x="20"   y="5.6" width="0.7" height="12.8"/>
      <rect class="str"  x="4"    y="7.7"  width="16.7" height="0.5"/>
      <rect class="str"  x="4"    y="10.3" width="16.7" height="0.6"/>
      <rect class="str"  x="4"    y="13"   width="16.7" height="0.7"/>
      <rect class="str"  x="4"    y="15.6" width="16.7" height="0.8"/>
      <circle class="pearl" cx="12.2" cy="12" r="1.2"/>
      <circle class="found" cx="6.9" cy="16" r="1.8"/>
    </svg>
    <h1>inlay</h1>
  </span>
  <span class="navs">
    <button id="gear" class="navbtn" aria-expanded="false" aria-controls="settings">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19.14 12.94a7.07 7.07 0 0 0 .06-.94 7.07 7.07 0 0 0-.06-.94l2.03-1.58a.5.5 0 0 0 .12-.61l-1.92-3.32a.5.5 0 0 0-.6-.22l-2.39.96a7.03 7.03 0 0 0-1.62-.94l-.36-2.54a.5.5 0 0 0-.5-.42h-3.84a.5.5 0 0 0-.5.42l-.36 2.54c-.59.24-1.13.56-1.62.94l-2.39-.96a.5.5 0 0 0-.6.22L2.74 8.87a.5.5 0 0 0 .12.61l2.03 1.58c-.04.31-.06.62-.06.94s.02.63.06.94l-2.03 1.58a.5.5 0 0 0-.12.61l1.92 3.32c.12.22.38.3.6.22l2.39-.96c.49.38 1.03.7 1.62.94l.36 2.54c.04.24.25.42.5.42h3.84c.25 0 .46-.18.5-.42l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.48 0 .6-.22l1.92-3.32a.5.5 0 0 0-.12-.61l-2.03-1.58zM12 15.6A3.6 3.6 0 1 1 12 8.4a3.6 3.6 0 0 1 0 7.2z"/></svg>
    </button>
  </span>
</header>

<!-- Shared SVG paint. A gradient is referenced by id, so it lives once in the
     document rather than in every redraw of the fretboard. -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="fbWood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" style="stop-color:var(--wood-a)"/>
      <stop offset="1" style="stop-color:var(--wood-b)"/>
    </linearGradient>
  </defs>
</svg>

<main class="stage">
  <div class="prompt" id="prompt" aria-live="polite"></div>
  <div class="board" id="board"></div>
</main>

<div id="scrim" hidden></div>
<div class="settings" id="instPanel" role="dialog" aria-modal="true"
     aria-labelledby="instTitle" tabindex="-1" hidden>
  <div class="sect">
    <h2 id="instTitle">Instruments</h2>
    <div class="instrows" id="instRows"></div>
    <div class="pick"><button id="instNew">New instrument</button></div>
  </div>
</div>

<div class="settings" id="editPanel" role="dialog" aria-modal="true" tabindex="-1" hidden></div>

<div class="settings" id="settings" role="dialog" aria-modal="true"
     aria-label="Settings" tabindex="-1" hidden>
  <div class="sect">
    <h2 id="npLabel">Note names</h2>
    <div class="pick" id="notePick" role="radiogroup" aria-labelledby="npLabel"></div>
  </div>

  <!-- Metadata, not a donation bar, and in millitap's order: lowest commitment
       first, so a one-off tip reads before a recurring one. What each link is
       for is said on hover, not in the line. -->
  <div class="sect about">
    <p>
      inlay <b id="aboutVer">—</b>
      <span class="sep">·</span>
      <a href="https://github.com/tehClayton/inlay" id="aboutSrc"
         target="_blank" rel="noopener noreferrer">source</a>
      <span class="sep">·</span>
      <a href="https://buymeacoffee.com/ditherstudio" id="aboutBmc"
         target="_blank" rel="noopener noreferrer">buy me a coffee</a>
      <span class="sep">·</span>
      <a href="https://www.patreon.com/DitherStudio" id="aboutPat"
         target="_blank" rel="noopener noreferrer">patreon</a>
    </p>
  </div>
</div>

<div id="msg" role="status" aria-live="polite"></div>
<button id="toast" type="button" hidden>Updated — tap to reload</button>

<script type="module">
import {
  $, h, label, say, showVersion, watchForUpdates,
  initPanels, openPanel, closePanel, isOpen,
} from "./ui.js";
import {
  loadInstruments, saveInstrument, deleteInstrument, loadSettings, saveSettings,
} from "./store.js";
import { newInstrument, summary, pitchAt, stringNumber } from "./instrument.js";
import { noteName, pitchName } from "./theory.js";
import { renderEditor } from "./editor.js";
import { createFretboard } from "./fretboard.js";

let settings = loadSettings();
let instruments = loadInstruments();

/* The instrument in use: the one last chosen, or failing that the first. */
const current = () =>
  instruments.find(i => i.id === settings.instrument) ?? instruments[0] ?? null;

const STORAGE_FAILED = "Couldn't save: this browser isn't letting inlay store anything.";

initPanels();

/* A panel's opener shows it is open, the way millitap's gear does. */
function panelButton(btn, panel, render){
  btn.onclick = () => {
    if (isOpen(panel)) { closePanel(panel); return; }
    render();
    btn.classList.add("on");
    btn.setAttribute("aria-expanded", "true");
    openPanel(panel, { opener: btn, onClose: () => {
      btn.classList.remove("on");
      btn.setAttribute("aria-expanded", "false");
    }});
  };
}

/* ---------------------------------------------------------------- board */
let board = null;

/* Until the drills arrive, tapping a position names it. It is also the
   quickest way to check an instrument is set up the way it is held. */
function tapped(pos){
  const inst = current();
  const midi = pitchAt(inst, pos.string, pos.fret);
  if (midi === null) return;
  board.clearMarks();
  board.mark(pos, "note", noteName(midi, settings.notePref));
  const where = `string ${stringNumber(pos.string, inst.strings.length)}, ` +
                (pos.fret === inst.strings[pos.string].start ? "open" : `fret ${pos.fret}`);
  $("prompt").replaceChildren(h("b", {}, pitchName(midi, settings.notePref)), h("i", {}, where));
}

function renderBoard(){
  const inst = current();
  $("instName").textContent = inst ? inst.name : "No instrument";
  label($("instBtn"), inst ? `Instrument: ${inst.name}. Switch or edit` : "Set up an instrument");
  $("prompt").replaceChildren();
  if (inst){
    $("board").classList.add("live");
    if (!board) board = createFretboard($("board"), { onTap: tapped });
    board.show(inst);
    $("prompt").replaceChildren(h("i", {}, `${summary(inst, settings.notePref)} — tap a fret to name it`));
  } else {
    if (board){ board.destroy(); board = null; }
    $("board").classList.remove("live");
    $("board").replaceChildren(h("div", { class: "boardinfo" },
      h("p", { class: "empty" }, "Tell inlay what you play: strings, tuning and frets."),
      h("button", { class: "go", onclick: e => edit(null, e.currentTarget) }, "Set up an instrument")));
  }
}

/* ----------------------------------------------------------- instruments */
function use(inst){
  settings.instrument = inst.id;
  saveSettings({ instrument: inst.id });
  renderBoard();
}

function renderInstruments(){
  const cur = current();
  $("instRows").replaceChildren(...instruments.map(inst => {
    const pick = h("button", { class: "pickme", onclick: () => { use(inst); closePanel($("instPanel")); } },
      h("b", {}, inst.name), h("i", {}, summary(inst, settings.notePref)));
    if (inst === cur) pick.setAttribute("aria-current", "true");
    const ed = h("button", { class: "mini", onclick: e => edit(inst, e.currentTarget) }, "Edit");
    label(ed, `Edit ${inst.name}`);
    return h("div", { class: "instrow" + (inst === cur ? " sel" : "") }, pick, ed);
  }));
}

panelButton($("instBtn"), $("instPanel"), renderInstruments);
$("instNew").onclick = e => edit(null, e.currentTarget);

/* Opens the editor on `inst`, or on a new instrument when null. */
function edit(inst, opener){
  const isNew = !inst;
  const done = () => closePanel($("editPanel"));
  renderEditor($("editPanel"), {
    inst: inst ?? newInstrument(),
    isNew,
    notePref: settings.notePref,
    boardSize: { width: $("board").clientWidth, height: $("board").clientHeight },
    onCancel: done,
    onSave: saved => {
      if (!saveInstrument(saved)){ say(STORAGE_FAILED); return; }
      instruments = loadInstruments();
      if (isNew) use(saved); else renderBoard();
      if (isOpen($("instPanel"))) renderInstruments();
      done();
      say(isNew ? `Added ${saved.name}` : `Saved ${saved.name}`);
    },
    onDelete: gone => {
      if (!confirm(`Delete "${gone.name}"? This can't be undone.`)) return;
      if (!deleteInstrument(gone.id)){ say(STORAGE_FAILED); return; }
      instruments = loadInstruments();
      if (settings.instrument === gone.id && instruments[0]) use(instruments[0]);
      renderBoard();
      if (isOpen($("instPanel"))) renderInstruments();
      done();
      say(`Deleted ${gone.name}`);
    },
  });
  openPanel($("editPanel"), { opener });
}

/* ------------------------------------------------------------- settings */
function renderSettings(){
  const labels = { sharp: "Sharps", flat: "Flats", both: "Both" };
  $("notePick").replaceChildren(...Object.entries(labels).map(([pref, text]) => {
    const on = settings.notePref === pref;
    const b = h("button", {
      class: "chip" + (on ? " sel" : ""), role: "radio", "aria-checked": String(on),
      onclick: () => {
        settings.notePref = pref;
        if (!saveSettings({ notePref: pref })) say(STORAGE_FAILED);
        renderSettings();
        renderBoard();
      },
    }, `${text} ${noteName(1, pref)}`);
    return b;
  }));
}

label($("gear"), "Settings");
panelButton($("gear"), $("settings"), renderSettings);

renderBoard();
/* First visit: straight into setting up an instrument, since there is
   nothing else to do until there is one. */
if (!instruments.length) edit(null, $("instBtn"));

/* --------------------------------------------------------------- footer */
label($("aboutSrc"), "inlay on GitHub — the source and how to report a problem");
label($("aboutBmc"), "Buy me a coffee — a one-off tip if this has been useful");
label($("aboutPat"), "Patreon — support ongoing development");
showVersion($("aboutVer"));

/* -------------------------------------------------------------- install */
watchForUpdates();
</script>
</body>
</html>
